<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pinpoint | Distance finder</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <aside class="panel">
    <header class="brand">
      <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true">
        <circle cx="16" cy="16" r="13" fill="none" stroke="currentColor" stroke-width="2"/>
        <path d="M16 6l4 10-4 10-4-10z" fill="currentColor"/>
        <circle cx="16" cy="16" r="2" fill="#f4f0e6"/>
      </svg>
      <div>
        <h1>Pinpoint</h1>
        <p>Distance finder</p>
      </div>
    </header>

    <form id="search-form" class="search" role="search">
      <label class="sr-only" for="search-input">Search for a place</label>
      <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="11" cy="11" r="6.5" fill="none" stroke="currentColor" stroke-width="2"/>
        <path d="M16 16l5 5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      </svg>
      <input id="search-input" type="text" placeholder="Search a place or address" autocomplete="off" required>
      <button type="submit" class="btn btn-primary">Go</button>
    </form>

    <button id="locate-btn" class="btn btn-secondary" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="2"/>
        <path d="M12 2v4M12 18v4M2 12h4M18 12h4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      </svg>
      <span>Use my location</span>
    </button>

    <section id="result" class="card" aria-live="polite">
      <p id="status" class="status">Search for a place, or click anywhere on the map to drop a pin.</p>
      <p id="dest-name" class="dest" hidden></p>
      <dl id="stats" class="stats" hidden>
        <div class="stat stat-main">
          <dt>By road</dt>
          <dd id="stat-road">-</dd>
        </div>
        <div class="stat">
          <dt>Straight line</dt>
          <dd id="stat-straight">-</dd>
        </div>
        <div class="stat">
          <dt>Drive time</dt>
          <dd id="stat-time">-</dd>
        </div>
      </dl>
      <button id="save-btn" class="btn btn-ghost" type="button" hidden>Save this place</button>
    </section>

    <section class="saved">
      <h2>Saved places</h2>
      <ul id="places-list" class="places"></ul>
    </section>

    <footer class="foot">Map data &copy; OpenStreetMap contributors</footer>
  </aside>

  <main id="map" aria-label="Map"></main>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
